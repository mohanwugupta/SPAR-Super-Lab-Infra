[workspace]
name = "spar-project-template"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"
pip = "*"
git = "*"
curl = "*"

[pypi-dependencies]
openai = ">=1.0"
pyyaml = ">=6.0"
huggingface_hub = ">=0.34,<1.0"
transformers = "==4.57.6"
vllm = "==0.19.0"
pytest = ">=8"
ruff = ">=0.8"

[tasks]
test = "pytest -q"
lint = "ruff check ."
serve = "bash scripts/serve_vllm.sh"
experiment = "python experiments/run_first_experiment.py"
inference-smoke = "python examples/inference_smoke.py"
mechinterp-smoke = "python examples/mech_interp_smoke.py"

# Most projects need no data transfer task: ordinary-sized data can live
# directly in the project GitHub repository.
#
# For large Hugging Face artifacts, add project-specific tasks, e.g.:
# data-pull = "hf download SPAR-Super-Lab/my-data --repo-type dataset --local-dir /root/scratch/data"
# results-push = "hf upload SPAR-Super-Lab/my-artifacts /root/scratch/final-results results/latest --repo-type dataset"
