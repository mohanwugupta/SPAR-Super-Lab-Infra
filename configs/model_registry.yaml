# Canonical SPAR Super Lab shared model catalog.
#
# shared_path points to the RunPod Global Volume when mounted at /workspace.
# "revision: main" is acceptable while planning a model, but once a shared
# snapshot is installed for real experiments, replace it with the resolved
# Hugging Face commit SHA and commit that change.
#
# min_vram_gb is rough planning guidance, NOT a guarantee.

models:
  qwen25_1_5b:
    repo_id: Qwen/Qwen2.5-1.5B-Instruct
    revision: main
    local_dir_name: Qwen--Qwen2.5-1.5B-Instruct
    shared_path: /workspace/hot-cache/models/Qwen--Qwen2.5-1.5B-Instruct
    served_model_name: Qwen2.5-1.5B-Instruct
    tensor_parallel_size: 1
    gpus: 1
    min_vram_gb: 16
    max_model_len: 8192

  qwen25_7b:
    repo_id: Qwen/Qwen2.5-7B-Instruct
    revision: main
    local_dir_name: Qwen--Qwen2.5-7B-Instruct
    shared_path: /workspace/hot-cache/models/Qwen--Qwen2.5-7B-Instruct
    served_model_name: Qwen2.5-7B-Instruct
    tensor_parallel_size: 1
    gpus: 1
    min_vram_gb: 24
    max_model_len: 8192

  deepseek_r1_distill_qwen_32b:
    repo_id: deepseek-ai/DeepSeek-R1-Distill-Qwen-32B
    revision: main
    local_dir_name: deepseek-ai--DeepSeek-R1-Distill-Qwen-32B
    shared_path: /workspace/hot-cache/models/deepseek-ai--DeepSeek-R1-Distill-Qwen-32B
    served_model_name: DeepSeek-R1-Distill-Qwen-32B
    tensor_parallel_size: 1
    gpus: 1
    min_vram_gb: 80
    max_model_len: 8192

  llama33_70b:
    repo_id: meta-llama/Llama-3.3-70B-Instruct
    revision: main
    local_dir_name: meta-llama--Llama-3.3-70B-Instruct
    shared_path: /workspace/hot-cache/models/meta-llama--Llama-3.3-70B-Instruct
    served_model_name: Llama-3.3-70B-Instruct
    tensor_parallel_size: 2
    gpus: 2
    min_vram_gb: 160
    max_model_len: 8192
    gated: true
